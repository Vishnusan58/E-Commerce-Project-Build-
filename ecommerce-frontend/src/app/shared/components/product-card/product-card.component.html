<div class="card h-100">
  <img class="card-img-top" [src]="product?.imageUrl || 'https://via.placeholder.com/300x200'" alt="Product image" />
  <div class="card-body">
    <h5 class="card-title">{{ product?.name || 'Sample Product' }}</h5>
    <p class="card-text text-muted">{{ product?.description || 'Product description' }}</p>
    <div class="d-flex justify-content-between align-items-center">
      <span class="fw-bold">₹{{ product?.price || 0 }}</span>
      <app-star-rating></app-star-rating>
    </div>
  </div>
</div>
